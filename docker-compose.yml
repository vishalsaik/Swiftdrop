# SwiftDrop, whole: a database, the tables, and the server with the dashboard.
#
#   docker compose up --build            # then open http://127.0.0.1:8080
#   docker compose run --rm --entrypoint /app/seed api          # a demo menu
#   docker compose run --rm -e SWIFTDROP_NEW_PASSWORD='a long enough phrase' \
#       --entrypoint /app/user api -email you@example.com -name "Your Name"   # the first staff account
#
# Nothing here is published except the server, and only on this computer (127.0.0.1). The
# database has no published port and a password that only the containers know. Set
# SWIFTDROP_PORT to use another port than 8080, and STRIPE_KEY (a test key) in YOUR shell,
# never in a file, to use Stripe instead of the built-in fake payment gateway.
name: swiftdrop

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swiftdrop
      POSTGRES_PASSWORD: swiftdrop
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swiftdrop"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the tables or brings them up to date, then exits. Safe to run every time.
  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://postgres:swiftdrop@db:5432/swiftdrop?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SWIFTDROP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://postgres:swiftdrop@db:5432/swiftdrop?sslmode=disable
      # Passed through from your shell if set there; empty means the built-in fake gateway.
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # How often refunds are retried and payments are checked: the defaults, unless the tests want it quick.
      REFUND_INTERVAL: ${REFUND_INTERVAL:-}
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  dbdata:
